version: 2

project_name: jarvis

before:
  hooks:
    - go mod tidy

builds:
  # Every target MUST be built with cgo enabled. The USB / HID layer that talks
  # to Ledger and Trezor devices (util/account/usb) has two implementations
  # selected by build tags: the real hidapi/libusb bindings (cgo) and a silent
  # no-op stub (util/account/usb/usb_disabled.go) used when CGO_ENABLED=0. A
  # cgo-less binary compiles and runs fine but `usb.Enumerate` always returns
  # zero devices, so hardware wallets can NEVER be found. Cross-compiling
  # without setting CC defaults CGO_ENABLED=0, which is exactly how the broken
  # darwin/amd64 + windows bottles shipped. Each build below pins a real cross
  # C toolchain (provided by the goreleaser-cross image) and asserts cgo in a
  # post hook so a stubbed binary can never be published again.
  - <<: &build_defaults
      binary: bin/jarvis
      main: ./
      ldflags:
        - -s -w -X github.com/tranvictor/jarvis/cmd.VERSION={{ .Version }}
      hooks:
        post:
          - cmd: ./scripts/assert-cgo.sh "{{ .Path }}"
    id: darwin-amd64
    goos: [darwin]
    goarch: [amd64]
    env:
      - CGO_ENABLED=1
      - CC=o64-clang
      - CXX=o64-clang++

  - <<: *build_defaults
    id: darwin-arm64
    goos: [darwin]
    goarch: [arm64]
    env:
      - CGO_ENABLED=1
      - CC=oa64-clang
      - CXX=oa64-clang++

  - <<: *build_defaults
    id: linux-amd64
    goos: [linux]
    goarch: [amd64]
    env:
      - CGO_ENABLED=1
      - CC=x86_64-linux-gnu-gcc
      - CXX=x86_64-linux-gnu-g++

  - <<: *build_defaults
    id: linux-arm64
    goos: [linux]
    goarch: [arm64]
    env:
      - CGO_ENABLED=1
      - CC=aarch64-linux-gnu-gcc
      - CXX=aarch64-linux-gnu-g++

  - <<: *build_defaults
    id: windows-amd64
    goos: [windows]
    goarch: [amd64]
    env:
      - CGO_ENABLED=1
      - CC=x86_64-w64-mingw32-gcc
      - CXX=x86_64-w64-mingw32-g++

archives:
  - id: nix
    builds: [darwin-amd64, darwin-arm64, linux-amd64, linux-arm64]
    <<: &archive_defaults
      name_template: '{{ .ProjectName }}_{{ .Version }}_{{ if eq .Os "darwin" }}macOS{{ else }}{{ .Os }}{{ end }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}'
    wrap_in_directory: true
    format: tar.gz
    files:
      - LICENSE
  - id: windows
    builds: [windows-amd64]
    <<: *archive_defaults
    wrap_in_directory: false
    format: zip
    files:
      - LICENSE

# Linux packages attached to the GitHub release. A Pages workflow then turns
# them into signed apt/yum repos so users can apt/dnf upgrade.
nfpms:
  - id: linux-packages
    # goreleaser-cross v1.23.2 predates nfpms.ids (v2.8); `builds` is still
    # accepted there and aliased to ids on newer goreleaser.
    builds: [linux-amd64, linux-arm64]
    vendor: tranvictor
    homepage: https://github.com/tranvictor/jarvis
    maintainer: Victor Tran <vu.tran54@gmail.com>
    description: Onchain (EVM compatible) operation made easy
    license: MIT
    formats: [deb, rpm]
    bindir: /usr/bin
    section: utils
    priority: optional
    contents:
      - src: LICENSE
        dst: /usr/share/doc/jarvis/LICENSE
        file_info:
          mode: 0o644

scoops:
  - name: jarvis
    ids: [windows]
    repository:
      owner: tranvictor
      name: homebrew-tranvictor
    skip_upload: auto
    homepage: https://github.com/tranvictor/jarvis
    description: Onchain (EVM compatible) operation made easy
    license: MIT
    commit_msg_template: "Scoop update for {{ .ProjectName }} version {{ .Tag }}"

brews:
  - name: jarvis
    ids: [nix]
    repository:
      owner: tranvictor
      name: homebrew-tranvictor
    skip_upload: auto
    description: Onchain (EVM compatible) operation made easy
    homepage: https://github.com/tranvictor/jarvis
    directory: Formula
    custom_block: |
      head do
        url "https://github.com/tranvictor/jarvis.git"
        depends_on "go"
      end
    caveats: |
      If the `jarvis` command is not found, open a new terminal window.
      Or run this once in the current window:
        eval "$(#{HOMEBREW_PREFIX}/bin/brew shellenv)"

      After a new GitHub release, refresh the tap before upgrading:
        brew update
        brew upgrade tranvictor/jarvis/jarvis
    post_install: |
      # Intel Homebrew already links into /usr/local/bin, which macOS puts on
      # PATH by default. Apple Silicon (/opt/homebrew) and Linuxbrew do not.
      brew_bin = HOMEBREW_PREFIX/"bin"
      return if OS.mac? && brew_bin == Pathname.new("/usr/local/bin")

      line = %(eval "$(#{HOMEBREW_PREFIX}/bin/brew shellenv)")
      home = Pathname.new(Dir.home)
      # Write zsh *and* bash files. .zprofile/.zshrc are ignored if the user
      # is on bash (or vice versa); unused files are harmless.
      files = [
        home/".zprofile", home/".zshrc",
        home/".bash_profile", home/".bashrc",
      ]
      files << home/".profile" unless OS.mac?

      files.uniq.each do |file|
        text = file.exist? ? file.read : ""
        next if text.include?("brew shellenv") || text.include?(brew_bin.to_s)

        file.open("a") do |io|
          io.puts
          io.puts "# Added by the jarvis formula so the jarvis command is on PATH"
          io.puts line
        end
        ohai "Added Homebrew to PATH in #{file}"
      end
    install: |
      system "make", "jarvis" if build.head?
      bin.install "bin/jarvis"
    test: |
      help_text = shell_output("jarvis -h")
      assert_includes help_text, "Usage:"
